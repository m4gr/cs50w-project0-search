<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 15px;
        }

        .navbar a {
            text-decoration: none;
            color: #202124;
            font-size: 14px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .header {
            padding: 10px 45px;
            border-bottom: 1px solid #ebebeb;
        }

        .header h1 {
            color: #d93025;
            font-size: 20px;
            font-weight: normal;
            margin: 0;
        }

        .container {
            padding: 30px 45px;
            max-width: 1000px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-label {
            width: 200px;
            font-size: 13px;
            color: #222;
        }

        .form-input {
            flex-grow: 1;
            max-width: 500px;
        }

        .form-input input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            font-size: 13px;
            border: 1px solid #d9d9d9;
            border-radius: 1px;
            outline: none;
            box-sizing: border-box;
        }

        .form-input input[type="text"]:focus {
            border-color: #4d90fe;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            max-width: 700px;
            margin-top: 20px;
        }

        .btn-advanced {
            background-color: #4d90fe;
            color: white;
            border: 1px solid #3079ed;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
        }

        .btn-advanced:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html">Google Search</a>
        <a href="images.html">Images</a>
    </div>

    <div class="header">
        <h1>Advanced Search</h1>
    </div>

    <div class="container">
        <form action="https://www.google.com/search">
            
            <div class="form-row">
                <div class="form-label">Find pages with all these words:</div>
                <div class="form-input">
                    <input type="text" name="q">
                </div>
            </div>

            <div class="form-row">
                <div class="form-label">This exact word or phrase:</div>
                <div class="form-input">
                    <input type="text" name="as_epq">
                </div>
            </div>

            <div class="form-row">
                <div class="form-label">Any of these words:</div>
                <div class="form-input">
                    <input type="text" name="as_oq">
                </div>
            </div>

            <div class="form-row">
                <div class="form-label">None of these words:</div>
                <div class="form-input">
                    <input type="text" name="as_eq">
                </div>
            </div>

            <div class="button-row">
                <input type="submit" value="Advanced Search" class="btn-advanced">
            </div>

        </form>
    </div>

</body>
</html>
